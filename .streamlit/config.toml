# Tela local: só 127.0.0.1, sem detalhe de erro nem barra de ferramentas, tema escuro (ver README, "Tela").
[server]
address = "127.0.0.1"
headless = true
enableCORS = true
enableXsrfProtection = true
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "viewer"

[theme]
base = "dark"
backgroundColor = "#1e2227"
secondaryBackgroundColor = "#2a3038"
textColor = "#e4e7eb"
primaryColor = "#6cb6ff"
