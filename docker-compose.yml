services:
  banco:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${PG_SENHA_ADMIN:?defina PG_SENHA_ADMIN no .env}
      POSTGRES_DB: srag
    ports:
      # só na máquina local: publicar em 0.0.0.0 abriria o banco para a rede (Wi-Fi, VPN)
      - "127.0.0.1:5435:5432"
    volumes:
      - dados_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # Aplicação (opcional): make docker-build, depois make docker-carga, make docker-indexar e
  # make docker-relatorio UF=SP
  app:
    build:
      context: .
      args:
        SRAG_VERSAO_CODIGO: ${SRAG_VERSAO_CODIGO:-desconhecida}
    profiles: ["app"]
    env_file: .env
    # A CLI não precisa de nenhuma capacidade do Linux nem de subir privilégio (setuid).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      PG_HOST: banco
      PG_PORTA: "5432"
      TZ: America/Sao_Paulo  # a data de execução do relatório é a do Brasil, não a UTC
    volumes:
      - ./dados:/app/dados:ro
      - ./relatorios:/app/relatorios
      - ./docs:/app/docs
      - ./.cache:/app/.cache
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados_pg:
