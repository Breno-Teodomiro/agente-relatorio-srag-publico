[project]
name = "srag-agente"
version = "0.1.0"
description = "Agente que gera relatório de SRAG com métricas do Open DATASUS e notícias (PoC Indicium HealthCare)"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2",
  "langchain-core>=1.6",
  "langchain-openai>=1.7",
  "psycopg[binary]>=3.3",
  "pgvector>=0.5",
  "numpy>=1.26",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "httpx>=0.27",
  "feedparser>=6.0",
  "pymupdf>=1.28",
  "fastembed>=0.9",
  "jinja2>=3.1",
  "matplotlib>=3.11",
]

[project.optional-dependencies]
observabilidade = ["langfuse>=3"]
app = ["streamlit==1.66.0"]

[project.scripts]
srag = "srag_agente.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srag_agente"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integracao: precisa do Postgres do Compose",
  "e2e: chama APIs reais e gasta crédito (rodar manualmente)",
]
addopts = "-m 'not e2e'"
